[package]
name = "resume-builder"
version = "0.1.0"
description = "A Resume Builder application"
authors = ["Abdullah Masood"]
edition = "2021"

[lib]
name = "resume_builder_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
